<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="titulo-pestana">Ficha de unidad · GaMa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="encabezado">
    <div class="contenedor">
      <a href="index.html" class="marca">
        <span class="logo">Ga<span>Ma</span></span>
        <span class="rubro">Transporte de material de construcción</span>
      </a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="listado_tabla.html">Unidades (tabla)</a>
        <a href="listado_box.html">Unidades (fichas)</a>
        <a href="comprar.html">Pedir un camión</a>
      </nav>
    </div>
  </header>

  <section class="seccion">
    <div class="contenedor" id="contenedor-ficha">
      <!-- Contenido generado por script a partir de data.js y ?id= en la URL -->
    </div>
  </section>

  <footer class="pie-pagina">
    <div class="contenedor">
      <span>GaMa — Transporte de material de construcción</span>
      <span>Actividad 5 · I.S.I 3º Comisión A · 2026</span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    const parametros = new URLSearchParams(window.location.search);
    const idPedido = parametros.get("id");
    const producto = buscarProducto(idPedido) || PRODUCTOS[0];

    document.getElementById("titulo-pestana").textContent = producto.nombre + " · GaMa";

    document.getElementById("contenedor-ficha").innerHTML = `
      <div class="ficha">
        <div class="panel-visual">
          <span class="categoria">${producto.categoria}</span>
          <img src="${producto.icono}" alt="Esquema de ${producto.nombre}" />
        </div>
        <div class="panel-datos">
          <h1>${producto.nombre}</h1>
          <p class="uso-destacado">${producto.uso}</p>
          <p class="descripcion">${producto.descripcion}</p>

          <dl class="lista-specs">
            <dt>Capacidad</dt>
            <dd>${producto.capacidad}</dd>
            <dt>Carga máxima</dt>
            <dd>${producto.cargaMaxima}</dd>
            <dt>Categoría</dt>
            <dd>${producto.categoria}</dd>
          </dl>

          <div class="franja-precio">
            <span class="cifra">${formatearPrecio(producto.precio)}</span>
            <span class="unidad">${producto.unidad}</span>
          </div>

          <div class="selector-cantidad">
            <label for="cantidad-producto">Cantidad</label>
            <input
              type="number"
              id="cantidad-producto"
              min="1"
              value="1"
              aria-describedby="subtotal-producto"
            />
            <div class="subtotal">
              <span>Subtotal</span>
              <span class="cifra" id="subtotal-producto">${formatearPrecio(producto.precio)}</span>
            </div>
          </div>

          <a class="boton boton-primario" href="comprar.html?id=${producto.id}">Pedir esta unidad</a>
        </div>
      </div>
    `;

    /* ------------------------------------------------------------------
       Parte B — Subtotal en tiempo real (cantidad × precio unitario)
       El campo "Cantidad" recién se crea al insertar el innerHTML de
       arriba, así que sus referencias al DOM se piden recién acá.
       ------------------------------------------------------------------ */
    const inputCantidad = document.getElementById("cantidad-producto");
    const spanSubtotal = document.getElementById("subtotal-producto");

    function actualizarSubtotal() {
      // Los <input type="number"> devuelven string; Number() los convierte.
      // Si el campo queda vacío o con texto inválido, se usa 1 por defecto
      // para no mostrar un subtotal roto ni permitir cantidades negativas.
      let cantidad = Number(inputCantidad.value);
      if (!cantidad || cantidad < 1) {
        cantidad = 1;
        inputCantidad.value = cantidad; // refleja en el propio campo el valor mínimo aplicado
      }

      const subtotal = producto.precio * cantidad;

      // Mutación del nodo <span>: se reemplaza el texto sin recargar la página.
      spanSubtotal.textContent = formatearPrecio(subtotal);
    }

    // "input" dispara en cada cambio de valor (tipeo, flechas del spinner,
    // rueda del mouse sobre el campo), a diferencia de "change" que espera
    // a que el campo pierda el foco.
    inputCantidad.addEventListener("input", actualizarSubtotal);
  </script>

</body>
</html>
